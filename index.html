<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111213"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="NYC Trip"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>New Year's NYC Trip</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: black station-sign band (trip + budget pill + day strip) → day map → timeline; bottom tab bar. Helvetica and subway bullets borrow the MTA's own sign system. */
:root{
  --bg:#F1F2F0; --surface:#FFFFFF; --ink:#141617; --muted:#5C6266; --line:#D8DBD9; --soft:#E8EAE8;
  --band:#111213; --band-ink:#F6F6F4; --band-muted:#A9AEB1;
  --accent:#0039A6; --accent-ink:#FFFFFF; --good:#0D7A3D; --bad:#C2261C; --warn:#A86200;
  --water:#C7D5DE; --land:#F8F8F5; --land2:#EFEFEB; --park:#D2E5CB; --street:#E2E3DF; --ave:#C9CCC7; --label:#6A7074; --coast:#AFC2CE;
  --c-food:#D9822B; --c-transit:#0039A6; --c-tickets:#B933AD; --c-hotel:#4A6B5D; --c-shop:#C2261C; --c-other:#8A8F93;
  --f-ui:"Helvetica Neue",Helvetica,Arial,system-ui,sans-serif; --f-num:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D0F10; --surface:#17191B; --ink:#ECEDEB; --muted:#9AA1A5; --line:#2A2E31; --soft:#202325;
  --band:#000000; --band-ink:#F2F2F0; --band-muted:#8E9497;
  --accent:#7AA2FF; --accent-ink:#0B1530; --good:#4BC47F; --bad:#FF6B5E; --warn:#F0B44C;
  --water:#0F1B24; --land:#1B1E20; --land2:#202427; --park:#1D2E22; --street:#262A2D; --ave:#353A3E; --label:#8C9498; --coast:#21323E;
  --c-food:#F0A35A; --c-transit:#7AA2FF; --c-tickets:#D57BE0; --c-hotel:#7FB09A; --c-shop:#FF6B5E; --c-other:#A3A9AD; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D0F10; --surface:#17191B; --ink:#ECEDEB; --muted:#9AA1A5; --line:#2A2E31; --soft:#202325;
  --band:#000000; --band-ink:#F2F2F0; --band-muted:#8E9497;
  --accent:#7AA2FF; --accent-ink:#0B1530; --good:#4BC47F; --bad:#FF6B5E; --warn:#F0B44C;
  --water:#0F1B24; --land:#1B1E20; --land2:#202427; --park:#1D2E22; --street:#262A2D; --ave:#353A3E; --label:#8C9498; --coast:#21323E;
  --c-food:#F0A35A; --c-transit:#7AA2FF; --c-tickets:#D57BE0; --c-hotel:#7FB09A; --c-shop:#FF6B5E; --c-other:#A3A9AD; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-ui);font-size:15px;line-height:1.4;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--band)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* sign band */
.band{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--band);color:var(--band-ink)}
.band{padding-top:6px}
.band::before{content:"";display:block;height:3px;background:var(--band-ink);opacity:.9}
.band .wrap{padding-block:8px 8px;display:grid;gap:8px}
.brow{display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{display:flex;flex-direction:column;min-width:0}
.brand b{font-weight:700;font-size:18px;letter-spacing:-.01em;line-height:1.1}
.brand span{font-size:12px;color:var(--band-muted)}
.pill{border:0;border-radius:999px;padding:6px 11px;font-weight:700;font-size:13px;white-space:nowrap;background:var(--good);color:#fff;display:inline-flex;gap:6px;align-items:center}
.pill.over{background:var(--bad)}
.pill small{font-weight:400;opacity:.9}
.days{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;margin-inline:-4px;padding:0 4px 2px}
.days::-webkit-scrollbar{display:none}
.dchip{flex:0 0 auto;border:1.5px solid #3A3E41;background:transparent;color:var(--band-ink);border-radius:8px;padding:3px 6px 2px;display:grid;justify-items:center;gap:0;min-width:44px}
.dchip span{font-size:10px;color:var(--band-muted);text-transform:uppercase;letter-spacing:.06em}
.dchip b{font-size:15px;font-weight:700;line-height:1}
.dchip i{font-style:normal;font-size:9.5px;height:11px;color:var(--band-muted)}
.dchip[aria-pressed="true"]{background:var(--band-ink);color:var(--band);border-color:var(--band-ink)}
.dchip[aria-pressed="true"] span,.dchip[aria-pressed="true"] i{color:var(--band)}
.dchip.done i{color:var(--good)}

main{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.view{display:grid;gap:16px;padding-block:16px}
.dayhead{display:grid;gap:2px}
.dayhead .lbl{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.dayhead h1{margin:0;font-size:22px;line-height:1.2;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.daysum{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}
.daysum b{color:var(--ink);font-weight:700}

.plan{display:grid;gap:16px}
@media (min-width:900px){.plan{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);align-items:start}.mapcard{position:sticky;top:calc(env(safe-area-inset-top,0px) + 116px)}}

/* map */
.mapcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:grid}
.maptools{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line)}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:5px 10px;font-size:13px;font-weight:700}
.seg button+button{border-left:1.5px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.mapkey{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11.5px;color:var(--muted)}
.mapkey i{display:inline-block;width:16px;height:0;border-top:3px solid var(--accent);vertical-align:middle;margin-right:4px}
.mapkey i.sub{border-top:3px dashed #FF6319}.mapkey i.lm{width:8px;height:8px;border:0;background:var(--c-tickets);transform:rotate(45deg);margin-right:6px}.mapkey i.car{border-top:3px dashed var(--muted)}.mapkey i.htl{border-top:3px dotted var(--ink)}
.mapbox{position:relative;height:min(52vh,460px);background:var(--water);touch-action:none;user-select:none;-webkit-user-select:none}
.mapbox svg{display:block;width:100%;height:100%}
.mapbtns{position:absolute;right:10px;top:10px;display:grid;gap:6px}
.mapbtns button{width:38px;height:38px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-size:18px;font-weight:700;display:grid;place-items:center;box-shadow:0 1px 2px rgb(0 0 0 / .12)}
.mapmsg{position:absolute;left:10px;bottom:10px;right:60px;font-size:12px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.m-land{fill:var(--land);stroke:var(--coast);stroke-width:1px;vector-effect:non-scaling-stroke}
.m-park{fill:var(--park)}
.m-minor{fill:none;stroke:var(--street);stroke-width:1px;vector-effect:non-scaling-stroke}
.m-ave{fill:none;stroke:var(--ave);stroke-width:1.6px;vector-effect:non-scaling-stroke}
.m-bridge{fill:none;stroke:var(--ave);stroke-width:3px;vector-effect:non-scaling-stroke}
.m-lab{fill:var(--label);font-family:var(--f-ui);paint-order:stroke;stroke:var(--land);stroke-width:3px;stroke-linejoin:round}
.m-lab.area{opacity:.75;font-weight:700;letter-spacing:.12em;font-size:10px}
.m-lab.ave,.m-lab.st{font-size:10px}
.m-lab.water{fill:var(--coast);stroke:none;font-style:italic;font-size:12px}
.m-lab.state{font-weight:700;letter-spacing:.14em;font-size:10px;stroke:var(--land2)}
.r-walk{fill:none;stroke:var(--accent);stroke-width:4.5px;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.r-sub{fill:none;stroke-width:4px;stroke-dasharray:8 6;stroke-linecap:round;vector-effect:non-scaling-stroke}
.r-car{fill:none;stroke:var(--muted);stroke-width:3.5px;stroke-dasharray:9 6;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.r-hotel{fill:none;stroke:var(--ink);stroke-width:2.5px;stroke-dasharray:1 6;stroke-linecap:round;vector-effect:non-scaling-stroke;opacity:.7}
.r-tram{fill:none;stroke:#C8102E;stroke-width:4px;stroke-dasharray:3 4;vector-effect:non-scaling-stroke}
.r-rail{fill:none;stroke:#1D4F91;stroke-width:4px;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.r-bus{fill:none;stroke:#3F7D3A;stroke-width:4px;stroke-dasharray:8 5;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.pin circle{fill:var(--ink);stroke:var(--surface);stroke-width:2}
.pin text{fill:var(--bg);font:700 11px var(--f-ui);text-anchor:middle;dominant-baseline:central}
.pin.done circle{fill:var(--good)}
.pin.sel circle{fill:var(--accent);stroke-width:3}
.pin.opt circle{fill:var(--surface);stroke:var(--ink);stroke-width:2;stroke-dasharray:3 2}
.pin.opt text{fill:var(--ink)}
.pin .pl{fill:var(--ink);font:700 11px var(--f-ui);text-anchor:start;paint-order:stroke;stroke:var(--land);stroke-width:3.5px;stroke-linejoin:round;dominant-baseline:central}
.hpin rect{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.hpin text{fill:var(--accent-ink);font:700 12px var(--f-ui);text-anchor:middle;dominant-baseline:central}
.me circle.halo{fill:var(--accent);opacity:.18}.me circle.dot{fill:var(--accent);stroke:#fff;stroke-width:2.5}.me .hd{fill:var(--accent);opacity:.8}
.acc{fill:var(--accent);opacity:.1;stroke:var(--accent);stroke-opacity:.35;stroke-width:1px;vector-effect:non-scaling-stroke}
.m-sline{fill:none;stroke-width:2.2px;opacity:.5;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.m-stn{fill:var(--surface);stroke:var(--ink);stroke-width:1.3}
.m-lab.stn{font-size:9.5px;font-weight:700;fill:var(--muted)}
.m-lab.stn .stn-l{font-weight:400}
.m-lm{fill:var(--c-tickets)}
.m-lab.lm{font-size:10.5px;font-weight:700;fill:var(--ink)}
.m-lab.st2{font-size:9px;opacity:.85}
.arr path{fill:var(--ink);stroke:var(--surface);stroke-width:1.4;stroke-linejoin:round}
.mapbtns button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

/* timeline */
.tl{list-style:none;margin:0;padding:0;display:grid}
.stop{display:grid;grid-template-columns:52px 28px minmax(0,1fr);column-gap:8px}
.stop .tm{font:700 12.5px var(--f-num);text-align:right;padding-top:12px;color:var(--ink)}
.stop .rail{position:relative}
.stop .rail::before{content:"";position:absolute;left:13px;top:0;bottom:0;width:2px;background:var(--line)}
.stop:first-child .rail::before{top:14px}
.stop:last-child .rail::before{bottom:auto;height:14px}
.node{position:absolute;left:3px;top:9px;width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--bg);font:700 11px var(--f-ui);display:grid;place-items:center;border:0;padding:0}
.node.dot{width:12px;height:12px;left:8px;top:14px;background:var(--surface);border:2px solid var(--muted)}
.node.opt{background:var(--surface);color:var(--ink);border:1.5px dashed var(--ink)}
.done .node{background:var(--good);color:#fff;border-color:var(--good)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;margin-block:4px;display:grid;gap:6px;min-width:0}
.sel .card{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.done .card{background:color-mix(in srgb,var(--good) 7%,var(--surface))}
.ctop{display:flex;justify-content:space-between;gap:8px;align-items:start}
.ctitle{font-weight:700;font-size:15px;line-height:1.25;min-width:0}
.ctitle small{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-left:6px;vertical-align:2px}
.csub{font-size:13px;color:var(--muted)}
.crow{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}
.money{display:flex;gap:10px;font-size:12.5px;color:var(--muted);align-items:baseline}
.money b{font:700 13.5px var(--f-num);color:var(--ink)}
.money b.over{color:var(--bad)}.money b.under{color:var(--good)}
.acts{display:flex;gap:6px}
.btn{border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 11px;font-size:13px;font-weight:700;display:inline-flex;gap:6px;align-items:center;min-height:34px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.on{background:var(--good);border-color:var(--good);color:#fff}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.danger{color:var(--bad)}
.leg{grid-column:3;display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--muted);padding:2px 0 6px 2px}
.bullet{display:inline-grid;place-items:center;min-width:20px;height:20px;border-radius:10px;padding:0 5px;font:700 11px var(--f-ui);flex:0 0 auto}
.lg-walk{width:18px;border-top:3px solid var(--accent);flex:0 0 auto}
.lg-hotel{width:18px;border-top:3px dotted var(--ink);flex:0 0 auto;opacity:.7}
.lg-car{width:18px;border-top:3px dashed var(--muted);flex:0 0 auto}
.entries{display:grid;gap:3px;border-top:1px dashed var(--line);padding-top:6px}
.ent{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;align-items:center;border:0;background:none;padding:2px 0;text-align:left;width:100%}
.ent span{color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ent b{font:700 12.5px var(--f-num)}
.maplink{white-space:nowrap;font-size:12px;color:var(--accent);text-decoration:none;font-weight:700}

/* budget */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:12px;min-width:0}
.panel h2{margin:0;font-size:17px;font-weight:700}
.panel h3{margin:0;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.big{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (min-width:640px){.big{grid-template-columns:repeat(4,minmax(0,1fr))}}
.stat{display:grid;gap:2px}
.stat span{font-size:12px;color:var(--muted)}
.stat b{font:700 22px var(--f-num);letter-spacing:-.02em}
.stat b.good{color:var(--good)}.stat b.bad{color:var(--bad)}
.meter{position:relative;height:22px;border-radius:6px;background:var(--soft);overflow:hidden}
.meter span{position:absolute;top:0;bottom:0}
.meter .spent{background:var(--ink)}
.meter .plan{background:repeating-linear-gradient(135deg,var(--muted) 0 3px,transparent 3px 7px);opacity:.55}
.meter .line{width:2px;background:var(--bad)}
.mkey{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted)}
.mkey i{display:inline-block;width:12px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.rows{display:grid;gap:8px}
.brow2{display:grid;grid-template-columns:62px minmax(0,1fr) 92px;gap:10px;align-items:center;font-size:13px;border:0;background:none;padding:0;text-align:left;width:100%}
.brow2 .d{font-weight:700}
.brow2 .v{font:700 13px var(--f-num);text-align:right}
.brow2 .v small{display:block;font-weight:400;font-size:11px;color:var(--muted)}
.bar{position:relative;height:14px;border-radius:4px;background:var(--soft);overflow:hidden}
.bar span{position:absolute;top:0;bottom:0}
.bar .p{background:repeating-linear-gradient(135deg,var(--muted) 0 3px,transparent 3px 7px);opacity:.5}
.bar .a{background:var(--accent)}
.bar .a.over{background:var(--bad)}
.catrow{display:grid;grid-template-columns:12px minmax(0,1fr) auto auto;gap:10px;align-items:center;font-size:13.5px}
.catrow i{width:12px;height:12px;border-radius:3px}
.catrow .v{font:700 13px var(--f-num);text-align:right;min-width:70px}
.catrow .v.m{color:var(--muted);font-weight:400}
.note{font-size:12.5px;color:var(--muted)}

/* log */
.logday{display:grid;gap:4px}
.logday h3{margin:6px 0 2px}
.lrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:9px 0;border-bottom:1px solid var(--line);border-left:0;border-right:0;border-top:0;background:none;text-align:left;width:100%}
.lrow .w{font-weight:700;font-size:14px;min-width:0}
.lrow .a{font:700 14px var(--f-num);text-align:right}
.lrow .m{grid-column:1/-1;font-size:12px;color:var(--muted)}
.tag{font-size:10.5px;font-weight:700;border-radius:4px;padding:1px 5px;background:var(--soft);color:var(--muted);margin-left:6px}
.empty{font-size:13.5px;color:var(--muted);padding:6px 0}
.row2{display:flex;flex-wrap:wrap;gap:8px}
textarea{width:100%;min-height:90px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);padding:8px;font:12px var(--f-num)}

/* info / hotels */
.hgrid{display:grid;gap:12px}
@media (min-width:760px){.hgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.hcard{border:1.5px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:8px;background:var(--surface);text-align:left;width:100%}
.hcard[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.hcard .ht{display:flex;justify-content:space-between;gap:8px;align-items:start}
.hcard .hn{font-weight:700;font-size:15px}
.hcard .badge{font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px;background:var(--soft);white-space:nowrap}
.hcard[aria-pressed="true"] .badge{background:var(--accent);color:var(--accent-ink)}
.hcard dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 10px;margin:0;font-size:13px}
.hcard dt{color:var(--muted)}.hcard dd{margin:0}
.hcard .hp{font:700 20px var(--f-num)}
.hcard .hp small{font:400 12px var(--f-ui);color:var(--muted)}
.todo{display:grid;gap:2px}
.todo label{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;align-items:start;font-size:14px;padding:7px 0;border-bottom:1px solid var(--line)}
.todo input{width:18px;height:18px;margin-top:1px;accent-color:var(--good)}
.todo label.on span{color:var(--muted);text-decoration:line-through}
.facts{display:grid;gap:8px;margin:0;padding:0;list-style:none;font-size:14px}
.facts li{display:grid;grid-template-columns:78px minmax(0,1fr);gap:10px}
.facts li b{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding-top:2px}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--band);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .wrap{display:grid;grid-template-columns:repeat(4,1fr);padding-block:6px}
.tab{border:0;background:none;color:var(--band-muted);display:grid;justify-items:center;gap:3px;padding:6px 0;font-size:11.5px;font-weight:700}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
.tab[aria-current="page"]{color:var(--band-ink)}
.tab[aria-current="page"] svg{stroke-width:2.3}

/* sheet */
.scrim{position:fixed;inset:0;background:rgb(0 0 0 / .45);z-index:40;display:grid;align-items:end;justify-items:center}

  if (M.follow) { setFollow(false); if (M.watch != null) { navigator.geolocation.clearWatch(M.watch); M.watch = null; } say('Stopped following. Tap ◎ to follow again.'); setTimeout(() => say(''), 2500); return; }
  if (!navigator.geolocation) { say('Location isn\u2019t available in this view. Open the installed app on your phone to see where you are.'); return; }
  setFollow(true); say('Finding you\u2026 (GPS works without signal)');
  let first = true;
  if (M.watch != null) navigator.geolocation.clearWatch(M.watch);
  M.watch = navigator.geolocation.watchPosition(pos => {
    M.me = {lon: pos.coords.longitude, lat: pos.coords.latitude, acc: pos.coords.accuracy, hd: pos.coords.heading, t: Date.now()};
    if (!$('#msvg')) return;
    const xy = drawMe();
    if (!meNear(xy)) { if (first) say('You\u2019re outside this map right now. Your dot shows up once you\u2019re there.'); first = false; return; }
    if (M.follow) centerOn(xy, first && M.view === 'nyc' ? Math.min(M.vb.w, 1600) : null);
    if (first) say('Following you. Drag the map to stop following.');
    if (first) setTimeout(() => say(''), 2500);
    first = false;
  }, err => { setFollow(false); say(err.code === 1 ? 'Location is turned off for this app. Allow it in Settings to see your dot.' : 'Couldn\u2019t get a location fix. Try again near a window or outside.'); },
  {enableHighAccuracy: true, timeout: 20000, maximumAge: 5000});
}
function selectStop(id, from) {
  UI.sel = id;
  document.querySelectorAll('.stop.sel').forEach(n => n.classList.remove('sel'));
  const li = document.getElementById('s-' + id); if (li) { li.classList.add('sel'); if (from === 'map') li.scrollIntoView({behavior: 'smooth', block: 'center'}); }
  M.svg && M.svg.querySelectorAll('.pin').forEach(p => p.classList.toggle('sel', p.dataset.id === id));
  const {st} = STOP[id] || {};
  if (st && from !== 'map' && M.svg) {
    const xy = M.view === 'nyc' && st.ll ? projN(st.ll[0], st.ll[1]) : M.view === 'region' && st.rp ? rpt(st.rp) : null;
    if (xy) { centerOn(xy, M.view === 'nyc' ? Math.min(M.vb.w, 1800) : null); if (window.innerWidth < 900) $('#mapbox').scrollIntoView({behavior: 'smooth', block: 'nearest'}); }
  }
  applyVB();
}

function exportObj() { return {app: 'nyc27', v: 1, from: S.device || 'Phone', at: Date.now(), entries: S.entries, visits: S.visits, todo: S.todo, settings: S.settings}; }
async function shareLog() {
  const txt = JSON.stringify(exportObj());
  const name = `nyc-trip-log-${(S.device || 'phone').toLowerCase()}-${new Date().toISOString().slice(5, 16).replace(/[:T]/g, '')}.json`;
  const out = $('#syncOut');
  try {
    const file = new File([txt], name, {type: 'application/json'});
    if (navigator.canShare && navigator.canShare({files: [file]})) { await navigator.share({files: [file], title: 'NYC trip log'}); toast('Shared'); return; }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  if (IS_PWA) { try { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([txt], {type: 'application/json'})); a.download = name; document.body.appendChild(a); a.click(); a.remove(); toast('Saved to downloads'); return; } catch (e) {} }
  out.innerHTML = `<div class="fld">Copy this text and send it to the other phone<textarea id="exportTxt" readonly>${esc(txt)}</textarea></div><button class="btn" type="button" data-act="copy">Copy</button>`;
}
function mergeIn(o) {
  if (!o || o.app !== 'nyc27' || !Array.isArray(o.entries)) throw new Error('That file isn’t a log from this trip app.');
  let added = 0, updated = 0;
  const mine = new Map(S.entries.map(e => [e.id, e]));
  o.entries.forEach(e => {
    if (!e || !e.id || typeof e.amt !== 'number') return;
    const m = mine.get(e.id);
    if (!m) { S.entries.push(e); mine.set(e.id, e); added++; }
    else if ((e.ts || 0) > (m.ts || 0)) { Object.assign(m, e); updated++; }
  });
  [['visits', o.visits], ['todo', o.todo]].forEach(([k, src]) => Object.entries(src || {}).forEach(([id, v]) => {
    const m = S[k][id]; if (!m || (v.ts || 0) > (m.ts || 0)) S[k][id] = v; }));
  if (o.settings && (o.settings.ts || 0) > (S.settings.ts || 0)) S.settings = Object.assign({}, S.settings, o.settings);
  S.merged.push({from: o.from || 'Other phone', at: Date.now(), added, updated}); S.merged = S.merged.slice(-10);
  save(); return {added, updated};
}
function importText(txt) {
  try { const r = mergeIn(JSON.parse(txt)); toast(`Merged: ${r.added} new, ${r.updated} updated`); render(); }
  catch (e) { toast(e.message && e.message.includes('trip app') ? e.message : 'Couldn’t read that log. Share it again from the other phone.'); }
}

function openSpend({stopId, dayId, entry}) {
  const st = stopId ? STOP[stopId].st : (entry && entry.stop ? STOP[entry.stop].st : null);
  const day = entry ? entry.day : stopId ? STOP[stopId].d.id : dayId || UI.day;
  const e = entry || {amt: '', cat: st ? st.cat : 'food', note: '', out: st ? st.cat === 'shopping' : false};
  let cat = e.cat, out = !!e.out, armed = false;
  const dOpts = DAYS.map(d => `<option value="${d.id}" ${d.id === day ? 'selected' : ''}>${d.dow} ${d.md}</option>`).join('');
  const title = st ? (st.hotel ? 'Hotel' : st.name) : 'Other spending';
  $('#sheet').innerHTML = `<div class="scrim" id="scrim"><form class="sheet" id="sform" autocomplete="off">
    <h2>${entry ? 'Edit spending' : 'Add spending'}</h2><div class="sub">${esc(title)}${st ? ` · plan ${money(planned(st))}` : ''}</div>
    <label class="amt"><span>$</span><input id="sAmt" type="text" inputmode="decimal" placeholder="0.00" value="${e.amt === '' ? '' : e.amt}" aria-label="Amount"></label>
    <div class="chips" role="group" aria-label="Category">${Object.entries(CATS).map(([k, c]) => `<button type="button" class="chipb" data-cat="${k}" aria-pressed="${k === cat}">${c.label}</button>`).join('')}</div>
    <label class="fld">Note<input id="sNote" type="text" value="${esc(e.note)}" placeholder="e.g. dinner at Joe Allen"></label>
    ${st ? '' : `<label class="fld">Day<select id="sDay">${dOpts}</select></label>`}
    <label class="chk"><input id="sOut" type="checkbox" ${out ? 'checked' : ''}> Extra, outside the trip budget (shopping, souvenirs)</label>
    <div class="sacts">${entry ? '<button type="button" class="btn danger" id="sDel">Delete</button>' : '<span></span>'}<div class="row2"><button type="button" class="btn" id="sCancel">Cancel</button><button type="submit" class="btn primary">Save</button></div></div>
  </form></div>`;
  const amt = $('#sAmt'); setTimeout(() => amt.focus(), 60);
  const close = () => { $('#sheet').innerHTML = ''; };
  $('#scrim').addEventListener('click', ev => { if (ev.target.id === 'scrim') close(); });
  $('#sCancel').onclick = close;
  $('#sform').querySelectorAll('[data-cat]').forEach(b => b.onclick = () => { cat = b.dataset.cat; $('#sform').querySelectorAll('[data-cat]').forEach(x => x.setAttribute('aria-pressed', x === b)); if (cat === 'shopping' && !entry) $('#sOut').checked = true; });
  if (entry) $('#sDel').onclick = ev => {
    if (!armed) { armed = true; ev.target.textContent = 'Tap again to delete'; return; }
    const m = S.entries.find(x => x.id === entry.id); m.del = true; m.ts = Date.now(); save(); close(); render(); toast('Deleted');
  };
  $('#sform').onsubmit = ev => {
    ev.preventDefault();
    const v = parseFloat(String(amt.value).replace(/[$,\s]/g, ''));
    if (!(v > 0)) { amt.focus(); amt.style.color = 'var(--bad)'; return; }
    const rec = {amt: Math.round(v * 100) / 100, cat, note: $('#sNote').value.trim(), out: $('#sOut').checked, ts: Date.now()};
    if (entry) Object.assign(S.entries.find(x => x.id === entry.id), rec);
    else S.entries.push(Object.assign({id: uid(), stop: stopId || null, day: st ? STOP[stopId].d.id : $('#sDay').value, by: S.device || ''}, rec));
    save(); close(); render(); toast(`Saved ${money(rec.amt)}`);
  };
}
function openWho() {
  $('#sheet').innerHTML = `<div class="scrim" id="scrim"><div class="sheet"><h2>Whose phone is this?</h2><div class="sub">Used to label what you log.</div>
    <div class="row2"><button class="btn primary" type="button" data-who="Jake">Jake</button><button class="btn primary" type="button" data-who="Momoka">Momoka</button></div></div></div>`;
  $('#scrim').addEventListener('click', ev => { if (ev.target.id === 'scrim') $('#sheet').innerHTML = ''; });
}
function openPaste() {
  $('#sheet').innerHTML = `<div class="scrim" id="scrim"><form class="sheet" id="pform"><h2>Paste a log</h2><div class="sub">Paste the text shared from the other phone.</div>
    <textarea id="pTxt" placeholder='{"app":"nyc27",…}'></textarea><div class="sacts"><span></span><div class="row2"><button type="button" class="btn" id="pCancel">Cancel</button><button class="btn primary" type="submit">Merge</button></div></div></form></div>`;
  $('#pCancel').onclick = () => $('#sheet').innerHTML = '';
  $('#pform').onsubmit = ev => { ev.preventDefault(); const t = $('#pTxt').value; $('#sheet').innerHTML = ''; importText(t); };
}
let toastT = 0;
function toast(t) { let n = $('#toast'); if (!n) { n = document.createElement('div'); n.id = 'toast'; n.className = 'toast'; n.setAttribute('role', 'status'); document.body.appendChild(n); } n.textContent = t; n.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => n.hidden = true, 2200); }

// ---------- render & events ----------
function render() {
  renderHeader();
  if (UI.tab === 'plan') renderPlan(); else if (UI.tab === 'budget') renderBudget(); else if (UI.tab === 'log') renderLog(); else renderInfo();
  saveUI();
}
document.addEventListener('click', ev => {
  const t = ev.target.closest('button,[data-act],a'); if (!t) return;
  if (t.dataset.day) { UI.day = t.dataset.day; UI.tab = 'plan'; UI.sel = null; render(); window.scrollTo({top: 0}); return; }
  if (t.dataset.tab) { UI.tab = t.dataset.tab; render(); window.scrollTo({top: 0}); return; }
  if (t.id === 'pill') { UI.tab = 'budget'; render(); window.scrollTo({top: 0}); return; }
  if (t.dataset.who) { S.device = t.dataset.who; save(); $('#sheet').innerHTML = ''; render(); toast(`This phone is ${S.device}’s`); return; }
  if (t.dataset.mapview) { UI.view[UI.day] = t.dataset.mapview; render(); return; }
  if (t.dataset.hotel) { S.settings.hotel = t.dataset.hotel; S.settings.ts = Date.now(); save(); render(); toast(`${HOTELS[t.dataset.hotel].short} is in the plan`); return; }
  if (t.dataset.z) {
    const b = M.box.getBoundingClientRect(); const cx = b.left + b.width / 2, cy = b.top + b.height / 2;
    if (t.dataset.z === 'in') zoomAt(cx, cy, 0.6); else if (t.dataset.z === 'out') zoomAt(cx, cy, 1 / 0.6); else if (t.dataset.z === 'fit') fitMap(); else locate();
    return;
  }
  const act = t.dataset.act; if (!act) return;
  if (act === 'focus') selectStop(t.dataset.id, 'list');
  else if (act === 'visit') { const id = t.dataset.id; const on = !visited(id); S.visits[id] = {on, ts: Date.now(), by: S.device}; save(); UI.sel = id; render(); if (on) toast('Marked done'); }
  else if (act === 'spend') openSpend({stopId: t.dataset.id});
  else if (act === 'spend-day') openSpend({dayId: UI.day});
  else if (act === 'edit') { const e = S.entries.find(x => x.id === t.dataset.eid); if (e) openSpend({entry: e}); }
  else if (act === 'share') shareLog();
  else if (act === 'paste') openPaste();
  else if (act === 'who') openWho();
  else if (act === 'copy') { const ta = $('#exportTxt'); try { navigator.clipboard.writeText(ta.value).then(() => toast('Copied'), () => { ta.select(); toast('Select all and copy'); }); } catch (e) { ta.select(); } }
});
document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.id === 'importFile' && t.files && t.files[0]) { const r = new FileReader(); r.onload = () => importText(String(r.result)); r.readAsText(t.files[0]); t.value = ''; }
  else if (t.dataset.todo) { S.todo[t.dataset.todo] = {on: t.checked, ts: Date.now()}; save(); t.closest('label').classList.toggle('on', t.checked); }
  else if (t.id === 'budgetIn') { const v = parseFloat(t.value); if (v > 0) { S.settings.budget = v; S.settings.ts = Date.now(); save(); render(); } }
});
let rz = 0; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (M.svg && document.body.contains(M.svg)) applyVB(); }, 120); });
window.addEventListener('storage', ev => { if (ev.key === KEY) { S = load(); render(); } });
render();

if (IS_PWA && 'serviceWorker' in navigator) {
  try { navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) {}
}
})();

</script>
